<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="One Night Wolf (一夜狼人殺): a one-night werewolf party game for 3–10 players. Create a room, share the code, play on phones or PCs.">
<meta name="theme-color" content="#0a1020"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230a1020%22%2F%3E%3Cpath%20d%3D%22M20%205a11%2011%200%201%200%207%2019A9%209%200%201%201%2020%205z%22%20fill%3D%22%23f2d184%22%2F%3E%3C%2Fsvg%3E"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>一夜狼人殺 One Night Wolf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>/* Layout: a round table under the moon by night; by day two benches face a council desk. */
:root {
  color-scheme: dark;
  --night: #0a1020;
  --dusk: #111a2e;
  --dusk-2: #172239;
  --dusk-3: #203050;
  --rim: #2b3b60;
  --fg: #edf0f8;
  --mute: #a3adc8;
  --faint: #6f7b9e;
  --moon: #f2d184;
  --moon-ink: #2a1f06;
  --ember: #e4584b;
  --moss: #68c49b;
  --hide: #d09b5b;
  --violet: #9c80e0;
  --shade: rgba(3, 6, 16, .62);
  --display: 'LXGW WenKai TC', 'Noto Serif TC', 'Songti TC', serif;
  --body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --r: 12px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--fg); font: 15px/1.55 var(--body); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--night); }
#root { max-width: 100vw; overflow-x: clip; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
h2 { font-size: 1.05rem; }
h3 { font-size: .92rem; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.display { font-family: var(--display); font-size: clamp(1.5rem, 3.4vw, 2.2rem); line-height: 1.2; }
.muted { color: var(--mute); }
.small { font-size: .82rem; }
.warn-text { color: var(--ember); }
.eyebrow { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--moon); }
.hint { color: var(--moon); font-weight: 600; }
.err { color: var(--ember); font-size: .86rem; }
.row-gap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row-gap.end { justify-content: flex-end; margin-top: 16px; }
.hscroll { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll > * { flex-shrink: 0; }

/* sky */
.sky { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%, var(--fg) 50%, transparent 51%),
    radial-gradient(1px 1px at 28% 62%, var(--mute) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 46% 12%, var(--fg) 50%, transparent 51%),
    radial-gradient(1px 1px at 66% 40%, var(--mute) 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 82% 22%, var(--fg) 50%, transparent 51%),
    radial-gradient(1px 1px at 90% 70%, var(--mute) 50%, transparent 51%),
    radial-gradient(1px 1px at 8% 84%, var(--mute) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 56% 88%, var(--faint) 50%, transparent 51%),
    radial-gradient(120% 80% at 50% -10%, var(--dusk-3) 0%, var(--night) 60%);
}
.ph-day .sky, .ph-vote .sky, .ph-hunt .sky { background: radial-gradient(120% 70% at 50% -20%, #33476f 0%, var(--dusk) 45%, var(--night) 100%); }

/* buttons & controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--rim); background: var(--dusk-2); color: var(--fg); cursor: pointer; font-weight: 600; transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--mute); background: var(--dusk-3); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.is-on { border-color: var(--moon); background: color-mix(in srgb, var(--moon) 18%, var(--dusk-2)); color: var(--moon); }
.btn-moon { background: var(--moon); border-color: var(--moon); color: var(--moon-ink); }
.btn-moon:hover:not(:disabled) { background: color-mix(in srgb, var(--moon) 86%, var(--fg)); border-color: var(--moon); }
.btn-ember { background: var(--ember); border-color: var(--ember); color: var(--fg); }
.btn-ember:hover:not(:disabled) { background: color-mix(in srgb, var(--ember) 85%, var(--fg)); border-color: var(--ember); }
.btn-ghost { background: transparent; }
.btn-sm { min-height: 32px; padding: 4px 12px; font-size: .84rem; }
.btn-lg { min-height: 48px; padding: 10px 24px; font-size: 1rem; }
.btn-test-on { background: color-mix(in srgb, var(--violet) 25%, var(--dusk-2)); border-color: var(--violet); color: var(--fg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--violet) 25%, transparent); }
.icon-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid transparent; background: transparent; color: var(--mute); cursor: pointer; font-size: 1.2rem; line-height: 1; display: inline-grid; place-items: center; }
.icon-btn:hover { border-color: var(--rim); color: var(--fg); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--night); border: 1px solid var(--rim); max-width: 100%; }
.seg button { border: 0; background: transparent; color: var(--mute); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: .86rem; white-space: nowrap; }
.seg button.is-on { background: var(--dusk-3); color: var(--fg); }
.seg button:disabled { cursor: default; }
.seg-sm button { padding: 3px 10px; font-size: .8rem; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: .72rem; border: 1px solid var(--rim); color: var(--mute); white-space: nowrap; }
.tag-moon { border-color: var(--moon); color: var(--moon); }
.tag-dim { color: var(--faint); }
.tag-warn { border-color: var(--ember); color: var(--ember); }
.pill { display: inline-flex; padding: 4px 12px; border-radius: 999px; background: var(--dusk-3); color: var(--mute); font-size: .86rem; }
.pill-moon { background: var(--moon); color: var(--moon-ink); font-weight: 700; }
.panel { background: color-mix(in srgb, var(--dusk) 92%, transparent); border: 1px solid var(--rim); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.panel-head.wrap { flex-wrap: wrap; }
.text-input, .code-input { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--rim); background: var(--night); color: var(--fg); font-size: 1.05rem; }
.text-input:focus, .code-input:focus { border-color: var(--moon); outline: none; }
.code-input { font-family: var(--mono); letter-spacing: .3em; text-transform: uppercase; font-size: 1.3rem; text-align: center; min-width: 0; }
.mini-select { min-height: 30px; padding: 2px 8px; border-radius: 8px; border: 1px solid var(--rim); background: var(--night); color: var(--fg); font-size: .8rem; max-width: 100%; min-width: 0; flex: 1; }
.note { width: 100%; resize: vertical; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--rim); background: var(--night); color: var(--fg); font-size: .8rem; min-height: 34px; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: .9rem; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch-ui { width: 40px; height: 22px; border-radius: 999px; background: var(--night); border: 1px solid var(--rim); position: relative; flex-shrink: 0; transition: background .15s; }
.switch-ui::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--mute); transition: transform .15s, background .15s; }
.switch input:checked + .switch-ui { background: color-mix(in srgb, var(--moon) 30%, var(--night)); border-color: var(--moon); }
.switch input:checked + .switch-ui::after { transform: translateX(18px); background: var(--moon); }
.switch input:focus-visible + .switch-ui { outline: 2px solid var(--moon); outline-offset: 2px; }
.switch input:disabled ~ * { opacity: .6; }
.spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--rim); border-top-color: var(--moon); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* role visuals */
.role-art { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
.team-wolf { --team: var(--ember); }
.team-village { --team: var(--moss); }
.team-tanner { --team: var(--hide); }
.rcard { display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; background: linear-gradient(180deg, var(--dusk-3), var(--dusk)); border: 1px solid color-mix(in srgb, var(--team) 45%, var(--rim)); box-shadow: inset 0 -3px 0 var(--team); }
.rcard-art { aspect-ratio: 7 / 8; padding: 10px 10px 0; }
.rcard-name { display: flex; flex-direction: column; align-items: center; padding: 6px 8px 10px; }
.rcard-zh { font-family: var(--display); font-size: 1.15rem; }
.rcard-en { font-size: .72rem; color: var(--mute); letter-spacing: .04em; }
.rcard-sm { width: 96px; } .rcard-md { width: 150px; } .rcard-lg { width: 200px; } .rcard-xl { width: 260px; }
.team-badge { display: inline-flex; padding: 2px 10px; border-radius: 999px; font-size: .76rem; border: 1px solid var(--team); color: var(--team); width: fit-content; }
.rchip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 2px; border-radius: 999px; background: var(--dusk-3); border: 1px solid color-mix(in srgb, var(--team) 50%, var(--rim)); font-size: .78rem; max-width: 100%; }
.rchip-art { width: 22px; height: 22px; border-radius: 50%; background: var(--night); object-fit: cover; object-position: top; }
.rchip-x { border: 0; background: transparent; color: var(--mute); cursor: pointer; padding: 0 2px; font-size: 1rem; line-height: 1; }
.clash { font-size: .72rem; color: var(--ember); font-weight: 700; margin-left: 2px; }
.cardback { position: relative; width: 100%; height: 100%; border-radius: 8px; color: var(--moon); background: linear-gradient(160deg, #24345c, #121b33); border: 1px solid color-mix(in srgb, var(--moon) 35%, transparent); display: grid; place-items: center; }
.cardback svg { width: 78%; height: 78%; }
.cardback-label { position: absolute; bottom: 4px; font-size: .7rem; }

/* nav */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--night) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid color-mix(in srgb, var(--rim) 60%, transparent); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); max-width: 1440px; margin: 0 auto; }
.brand { display: inline-flex; align-items: baseline; gap: 8px; color: var(--fg); text-decoration: none; flex-shrink: 0; }
.brand-moon { width: 20px; height: 20px; color: var(--moon); align-self: center; }
.brand-name { font-family: var(--display); font-size: 1.25rem; }
.brand-sub { font-size: .72rem; color: var(--mute); letter-spacing: .12em; text-transform: uppercase; }
.nav-tools { display: flex; align-items: center; gap: 6px; min-width: 0; }
.nav-room { padding: 2px 10px; border-radius: 6px; border: 1px dashed var(--moon); color: var(--moon); font-size: .85rem; }
@media (max-width: 640px) { .brand-sub, .nav-room { display: none; } .brand-name { font-size: 1.05rem; } }

.app > main { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 20px 40px; max-width: 1440px; margin: 0 auto; }

/* home */
.home { display: flex; flex-direction: column; gap: 28px; }
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: end; min-height: 360px; }
.hero-sky { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.hero-moon { position: absolute; right: 6%; top: 0; width: clamp(120px, 18vw, 220px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 38% 35%, #fff7dc, var(--moon) 55%, #c9a252 100%); box-shadow: 0 0 80px 20px color-mix(in srgb, var(--moon) 30%, transparent); opacity: .9; }
.hero-copy { position: relative; display: flex; flex-direction: column; gap: 12px; padding-bottom: 24px; }
.hero-title { font-family: var(--display); font-size: clamp(2.8rem, 8vw, 5.4rem); line-height: 1; letter-spacing: .04em; display: flex; flex-direction: column; gap: 8px; }
.hero-title small { font-family: var(--body); font-size: .82rem; letter-spacing: .4em; text-transform: uppercase; color: var(--moon); font-weight: 500; }
.hero-tag { font-family: var(--display); font-size: clamp(1.1rem, 2.4vw, 1.5rem); color: var(--fg); }
.hero-lead { color: var(--mute); max-width: 44ch; }
.lineup { position: relative; height: clamp(180px, 26vw, 300px); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.lineup .role-art { width: auto; height: 74%; flex: 0 0 auto; margin: 0 -2.2%; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); position: relative; z-index: 1; animation: bob 4s ease-in-out infinite; }
.lineup .lineup-3 { height: 96%; z-index: 2; }
.lineup .lineup-2, .lineup .lineup-4 { height: 84%; }
.lineup .lineup-1 { animation-delay: -1s; } .lineup .lineup-2 { animation-delay: -2s; } .lineup .lineup-4 { animation-delay: -1.5s; } .lineup .lineup-5 { animation-delay: -.5s; } .lineup .lineup-6 { animation-delay: -2.5s; }
.lineup-hill { position: absolute; left: -10%; right: -10%; bottom: -40px; height: 80px; border-radius: 50%; background: linear-gradient(180deg, #1a2a3e, var(--night)); z-index: 0; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.entry { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.entry-card { display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: var(--r); border: 1px solid var(--rim); background: color-mix(in srgb, var(--dusk) 90%, transparent); min-width: 0; }
.entry-card .btn { align-self: flex-start; }
.code-row { display: flex; gap: 8px; }
.code-row .btn { align-self: stretch; }
.mode-note { color: var(--mute); font-size: .84rem; max-width: 70ch; padding-left: 12px; border-left: 2px solid var(--rim); }
.mode-note.mode-room { border-left-color: var(--moss); }
@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; min-height: 0; }
  .hero-moon { width: 110px; right: 0; }
  .entry { grid-template-columns: 1fr; }
}

/* centered screens */
.center-screen { min-height: calc(100vh - 140px); display: grid; place-items: center; }
.name-panel, .status-panel { width: min(460px, 100%); padding: 28px; gap: 14px; align-items: flex-start; }
.status-panel { align-items: center; text-align: center; }
.status-art { width: 120px; height: 140px; }

/* lobby */
.lobby { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.lobby-side, .lobby-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.room-code-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.room-code { font-size: clamp(2rem, 6vw, 2.8rem); letter-spacing: .18em; color: var(--moon); font-weight: 600; }
.count { color: var(--mute); font-size: .84rem; }
.seat-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.seat-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; }
.seat-row.is-me { background: color-mix(in srgb, var(--moon) 9%, transparent); }
.seat-no { color: var(--faint); font-size: .84rem; }
.seat-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat-tags { display: flex; gap: 4px; }
.bot-tools { display: flex; gap: 6px; padding-top: 4px; border-top: 1px dashed var(--rim); padding-block: 10px 0; }
.pool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
.pool-tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px 8px; border-radius: 10px; border: 1px solid var(--rim); background: var(--night); opacity: .72; transition: opacity .15s, border-color .15s; }
.pool-tile.is-in { opacity: 1; border-color: color-mix(in srgb, var(--team) 60%, var(--rim)); background: linear-gradient(180deg, color-mix(in srgb, var(--team) 10%, var(--dusk-2)), var(--night)); }
.pool-art { width: 72px; height: 84px; }
.pool-name { display: flex; flex-direction: column; align-items: center; line-height: 1.2; text-align: center; }
.pool-name b { font-family: var(--display); font-size: 1rem; font-weight: 400; }
.pool-name small { font-size: .7rem; color: var(--mute); }
.stepper { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--rim); border-radius: 999px; padding: 2px; }
.stepper button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--dusk-3); cursor: pointer; font-size: 1rem; line-height: 1; }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper span { min-width: 22px; text-align: center; font-size: .9rem; }
.cfg-grid { display: flex; flex-direction: column; gap: 12px; }
.cfg-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.cfg-row > span { min-width: 6em; color: var(--mute); font-size: .9rem; }
.startbar { position: sticky; bottom: 0; z-index: 20; grid-column: 1 / -1; display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex-wrap: wrap; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(0deg, var(--night) 70%, transparent); }
@media (max-width: 860px) { .lobby { grid-template-columns: 1fr; } }

/* reveal */
.reveal { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.flip { width: min(260px, 66vw); aspect-ratio: 5 / 7; border: 0; background: transparent; padding: 0; perspective: 1200px; cursor: pointer; }
.flip-inner { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,1.3,.5,1); }
.flip.is-flipped .flip-inner { transform: rotateY(180deg); }
.flip-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
.flip-back .cardback { border-radius: 18px; }
.flip-hint { position: absolute; bottom: 14px; left: 0; right: 0; font-size: .84rem; color: var(--moon); }
.flip-front { transform: rotateY(180deg); background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--team) 22%, var(--dusk-3)), var(--dusk)); border: 2px solid var(--team); }
.flip-art { flex: 1; padding: 18px 18px 0; min-height: 0; }
.flip-name { display: flex; flex-direction: column; padding: 8px 0 16px; }
.flip-name b { font-family: var(--display); font-size: 1.8rem; font-weight: 400; }
.flip-name small { color: var(--mute); }
.reveal-info { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 46ch; }
.reveal-foot { display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(420px, 100%); }
.reveal-bar { display: block; width: 100%; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--moon) calc(var(--f) * 100%), var(--rim) 0); }

/* reminder */
.play { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
.play > * { min-width: 0; }
.reminder { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.reminder-column { position: sticky; top: 72px; }
.reminder-toggle { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; border: 1px solid var(--rim); background: var(--dusk-2); cursor: pointer; text-align: left; width: 100%; min-width: 0; }
.reminder-mini { width: 36px; height: 36px; border-radius: 50%; background: var(--night); object-fit: cover; object-position: top; flex-shrink: 0; }
.reminder-t { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; flex: 1; }
.reminder-t small { font-size: .68rem; color: var(--mute); }
.reminder-t b { font-family: var(--display); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reminder-caret { color: var(--mute); font-family: var(--mono); }
.reminder-body { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: var(--r); border: 1px solid var(--rim); background: var(--dusk); }
.reminder-body .rcard { width: 100%; }
.reminder-desc { font-size: .8rem; color: var(--mute); }
.reminder-chip { position: relative; flex: 0 0 auto; width: 210px; max-width: 100%; }
.reminder-chip .reminder-body { position: absolute; top: calc(100% + 8px); left: 0; width: 240px; z-index: 40; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
@media (max-width: 1100px) {
  .play { grid-template-columns: minmax(0, 1fr); }
  .reminder-column { position: static; }
  .reminder-column .reminder-toggle { width: fit-content; max-width: 100%; }
  .reminder-column.is-open .reminder-body { flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
  .reminder-column .reminder-body .rcard { width: 120px; }
  .reminder-column .reminder-body > :not(.rcard) { flex: 1 1 180px; }
}

/* order bar */
.orderbar { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 8px 10px; border-radius: 999px; border: 1px solid var(--rim); background: color-mix(in srgb, var(--night) 80%, transparent); min-width: 0; }
.orderbar-label { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); flex-shrink: 0; padding-left: 4px; }
.orderbar-track { display: flex; align-items: center; gap: 6px; min-width: 0; }
.order-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px 2px 2px; border-radius: 999px; background: var(--dusk-2); border: 1px solid var(--rim); font-size: .78rem; white-space: nowrap; }
.order-chip.is-now { border-color: var(--moon); background: color-mix(in srgb, var(--moon) 18%, var(--dusk-2)); box-shadow: 0 0 14px color-mix(in srgb, var(--moon) 40%, transparent); }
.order-chip.is-done { opacity: .5; }
.order-chip.is-passive { border-style: dashed; }
.order-n { font-family: var(--mono); font-size: .66rem; color: var(--faint); padding-left: 6px; }
.order-art { width: 24px; height: 24px; border-radius: 50%; background: var(--night); object-fit: cover; object-position: top; }
.order-x { font-family: var(--mono); color: var(--moon); font-size: .7rem; }
.order-div { font-size: .7rem; color: var(--faint); padding: 0 4px; border-left: 1px solid var(--rim); margin-left: 4px; white-space: nowrap; }

/* night */
.night-stage { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.night-grid > * { min-width: 0; }
.theater { position: relative; overflow: hidden; border-radius: 18px; border: 1px solid var(--rim); background: radial-gradient(90% 120% at 20% 100%, #1d2d4f, var(--night)); padding: 14px 20px; min-height: 170px; }
.theater.is-mine { border-color: var(--moon); box-shadow: 0 0 0 1px var(--moon), 0 0 40px color-mix(in srgb, var(--moon) 18%, transparent); }
.theater-sky { position: absolute; inset: 0; pointer-events: none; }
.fog { position: absolute; left: -20%; width: 140%; height: 60%; bottom: -10%; background: radial-gradient(closest-side, rgba(180,196,230,.12), transparent); animation: drift 18s linear infinite; }
.fog.f2 { bottom: 20%; height: 40%; animation-duration: 26s; animation-direction: reverse; opacity: .7; }
@keyframes drift { from { transform: translateX(-8%); } to { transform: translateX(8%); } }
.theater-slash { position: absolute; inset: -40% -10%; background: linear-gradient(115deg, transparent 44%, color-mix(in srgb, var(--moon) 70%, #fff) 49.5%, #fff 50%, transparent 56%); transform: translateX(-120%); animation: slash .9s .15s cubic-bezier(.7,0,.2,1) forwards; pointer-events: none; mix-blend-mode: screen; }
@keyframes slash { to { transform: translateX(120%); } }
.theater-row { position: relative; display: grid; grid-template-columns: clamp(120px, 20vw, 210px) minmax(0, 1fr); gap: 20px; align-items: center; }
.theater-hero { position: relative; height: clamp(140px, 20vw, 220px); display: grid; place-items: end center; animation: heroIn .9s .2s cubic-bezier(.2,1.4,.4,1) both; }
.theater-hero::before { content: ""; position: absolute; inset: 12% 6% 0; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--team, var(--moon)) 45%, transparent), transparent); filter: blur(6px); animation: aura 2.4s ease-in-out infinite; }
.theater-art { position: relative; height: 100%; width: auto; max-width: 100%; filter: drop-shadow(0 10px 16px rgba(0,0,0,.6)); animation: bob 3.4s ease-in-out infinite; }
.theater-hero.is-asleep .theater-art { filter: drop-shadow(0 10px 16px rgba(0,0,0,.6)) brightness(.55) saturate(.6); }
@keyframes heroIn { from { opacity: 0; transform: translateY(40px) scale(.8); } to { opacity: 1; transform: none; } }
@keyframes aura { 0%, 100% { opacity: .55; transform: scale(.95); } 50% { opacity: 1; transform: scale(1.05); } }
.theater-copy { display: flex; flex-direction: column; gap: 8px; min-width: 0; animation: copyIn .6s .5s ease-out both; }
@keyframes copyIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
.theater-title { font-family: var(--display); font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.05; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; font-weight: 400; }
.theater-title small { font-family: var(--body); font-size: .9rem; color: var(--mute); letter-spacing: .06em; }
.theater-act { color: var(--fg); max-width: 60ch; }
.theater-status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.night-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 16px; align-items: start; }
@media (max-width: 900px) { .night-grid { grid-template-columns: minmax(0, 1fr); } .theater-row { grid-template-columns: 110px minmax(0, 1fr); gap: 12px; } .theater-hero { height: 140px; } }

.table { position: relative; width: 100%; max-width: min(720px, max(330px, calc((100dvh - 360px) * 1.12))); margin: 0 auto; aspect-ratio: 1.12 / 1; }
.table-top { position: absolute; inset: 14% 12%; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #3a2d22, #24190f 70%); box-shadow: inset 0 0 0 6px #4a3826, inset 0 0 40px rgba(0,0,0,.6), 0 20px 50px rgba(0,0,0,.5); }
.table.is-dim .table-top { filter: brightness(.65); }
.table-arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; color: var(--ember); overflow: visible; z-index: 3; }
.team-arrow { fill: none; stroke: currentColor; stroke-width: 3; stroke-dasharray: 6 5; animation: dash 1s linear infinite; filter: drop-shadow(0 0 4px currentColor); }
@keyframes dash { to { stroke-dashoffset: -22; } }
.tcard { position: absolute; transform: translate(-50%, -50%); width: clamp(46px, 11.5%, 82px); aspect-ratio: 5 / 7; padding: 0; border: 0; background: transparent; cursor: default; z-index: 2; display: block; }
.tcard .cardback, .tcard-face { transition: transform .2s, box-shadow .2s; }
.tcard-face { display: block; width: 100%; height: 100%; border-radius: 8px; background: radial-gradient(circle at 50% 30%, var(--dusk-3), var(--dusk)); border: 1px solid var(--moon); padding: 3px; }
.tcard-label { position: absolute; left: 50%; top: calc(100% + 4px); transform: translateX(-50%); font-size: .72rem; white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis; color: var(--fg); text-shadow: 0 1px 3px #000; }
.tcard-label b { color: var(--moon); font-weight: 600; }
.tcard-center .tcard-label { color: var(--mute); }
.tcard.is-me .cardback { box-shadow: 0 0 0 2px var(--moon); }
.tcard.is-pickable { cursor: pointer; }
.tcard.is-pickable .cardback, .tcard.is-pickable .tcard-face { box-shadow: 0 0 0 2px color-mix(in srgb, var(--moon) 70%, transparent), 0 0 18px color-mix(in srgb, var(--moon) 40%, transparent); animation: pulse 1.6s ease-in-out infinite; }
.tcard.is-pickable:hover .cardback { transform: translateY(-4px); }
.tcard.is-sel .cardback, .tcard.is-sel .tcard-face { box-shadow: 0 0 0 3px var(--moon), 0 0 24px var(--moon); transform: translateY(-6px) scale(1.06); animation: none; }
.tcard.is-mate .cardback { box-shadow: 0 0 0 3px var(--ember), 0 0 20px var(--ember); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }
.ghost-card { position: absolute; left: 0; top: 0; width: clamp(46px, 11.5%, 82px); aspect-ratio: 5 / 7; border-radius: 8px; z-index: 6; pointer-events: none; background: linear-gradient(160deg, #3a4f86, #17213e); border: 2px solid var(--moon); box-shadow: 0 10px 30px rgba(0,0,0,.6), 0 0 20px color-mix(in srgb, var(--moon) 50%, transparent); }
.ghost-b { background: linear-gradient(160deg, #6a3a5a, #2a1530); }
.beam { position: absolute; height: 4px; margin-top: -2px; z-index: 5; pointer-events: none; transform-origin: left center; background: linear-gradient(90deg, color-mix(in srgb, var(--violet) 80%, #fff), transparent); border-radius: 2px; box-shadow: 0 0 14px var(--violet); }
.action-panel h2 { font-family: var(--display); font-size: 1.4rem; font-weight: 400; }
.center-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.info-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.info { padding: 8px 10px; border-radius: 8px; background: var(--dusk-2); border-left: 3px solid var(--moon); font-size: .88rem; }
.info-team { border-left-color: var(--ember); }
.info-skip { border-left-color: var(--rim); color: var(--mute); }
.learned { display: flex; flex-direction: column; gap: 8px; }
.learned h3 { color: var(--mute); font-weight: 500; }

/* countdown */
.countdown { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; background: var(--night); border: 1px solid var(--rim); overflow: hidden; }
.countdown-bar { position: absolute; left: 0; bottom: 0; height: 2px; width: calc(var(--f) * 100%); background: var(--moon); transition: width .25s linear; }
.countdown-num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .95rem; }
.countdown-big .countdown-num { font-size: 1.5rem; font-weight: 600; }
.countdown.warn { border-color: var(--ember); }
.countdown.warn .countdown-num { color: var(--ember); }
.countdown.warn .countdown-bar { background: var(--ember); }

/* day */
.day-bar { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.day-title { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 260px; }
.day-actions { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
.council { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px) minmax(0, 1fr); gap: 14px; align-items: start; }
.bench { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; min-width: 0; }
@media (max-width: 1180px) { .council { grid-template-columns: minmax(0, 1fr); } .desk { position: static; } }
@media (max-width: 560px) { .bench { grid-template-columns: 1fr; } }
.pcard { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: var(--r); background: var(--dusk); border: 1px solid var(--rim); min-width: 0; overflow: hidden; transition: border-color .15s, transform .15s; }
.pcard.is-me { border-color: color-mix(in srgb, var(--moon) 60%, var(--rim)); }
.is-aiming .pcard.is-target { cursor: crosshair; border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember); }
.is-aiming .pcard.is-target:hover { transform: translateY(-2px); background: color-mix(in srgb, var(--ember) 10%, var(--dusk)); }
.pcard-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pcard-no { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--dusk-3); color: var(--moon); font-size: .82rem; flex-shrink: 0; }
.pcard-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.pcard-tags { display: flex; gap: 4px; flex-shrink: 0; }
.pcard-claim { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 28px; }
.dove { font-size: .72rem; color: var(--moss); }
.markers { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px dashed var(--rim); }
.markers-tall { min-height: 220px; }
.markers-top { display: flex; align-items: center; gap: 6px; }
.lock-note { font-size: .8rem; opacity: .7; }
.marker-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.pins { display: flex; flex-wrap: wrap; gap: 3px; }
.pin { min-width: 28px; height: 26px; padding: 0 5px; border-radius: 7px; border: 1px solid var(--rim); background: var(--night); cursor: pointer; font-size: .8rem; line-height: 1; color: var(--mute); }
.pin.is-on { border-color: var(--moon); background: color-mix(in srgb, var(--moon) 20%, var(--night)); color: var(--fg); }
.splat-slot { position: absolute; inset: 0; pointer-events: none; }
.stain { position: absolute; inset: 0; border-radius: inherit; animation: stain 6s ease-out forwards; }
.stain-egg { background: radial-gradient(circle at 55% 40%, #ffd24a 0 12%, #fff6d8 13% 26%, transparent 40%); }
.stain-tomato { background: radial-gradient(circle at 45% 45%, #c8322b 0 18%, #e2584b 19% 30%, transparent 44%), radial-gradient(circle at 60% 55%, #5d8a3a 0 4%, transparent 5%); }
.stain-poo { background: radial-gradient(circle at 50% 45%, #6b4220 0 20%, #8a5a2e 21% 32%, transparent 46%); }
@keyframes stain { 0% { opacity: 0; transform: scale(.4); } 8% { opacity: .95; transform: scale(1.05); } 70% { opacity: .85; } 100% { opacity: 0; transform: scale(1); } }
.desk { position: sticky; top: 72px; gap: 14px; }
.desk .panel-head h2 { font-family: var(--display); font-size: 1.3rem; font-weight: 400; }
.claim-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.claim-btn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border-radius: 10px; border: 1px solid var(--rim); background: var(--night); cursor: pointer; transition: border-color .15s, transform .1s; min-width: 0; }
.claim-btn:hover { border-color: var(--team); }
.claim-btn:active { transform: scale(.97); }
.claim-btn.is-mine { border-color: var(--moon); background: color-mix(in srgb, var(--moon) 14%, var(--night)); }
.claim-art { width: 44px; height: 50px; }
.claim-name { font-size: .8rem; text-align: center; }
.claim-who { font-size: .66rem; color: var(--moon); }
.claim-btn .clash { position: absolute; top: 3px; right: 5px; }
.center-marks { display: flex; flex-direction: column; gap: 8px; }
.center-mark-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.center-box { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 10px; background: var(--night); border: 1px solid var(--rim); min-width: 0; }
.center-box .markers { border-top: 0; padding-top: 0; }
.center-box .lock-note { display: none; }
.center-box .pins { gap: 2px; } .center-box .pin { min-width: 24px; padding: 0 3px; }
.center-box-head { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--mute); }
.mini-back { width: 14px; height: 20px; border-radius: 3px; background: linear-gradient(160deg, #24345c, #121b33); border: 1px solid color-mix(in srgb, var(--moon) 45%, transparent); }
@media (max-width: 420px) { .center-mark-grid { grid-template-columns: 1fr; } .markers-tall { min-height: 0; } }

/* armory */
.armory { position: fixed; right: 0; top: 46%; z-index: 35; display: flex; align-items: center; transform: translateX(calc(100% - 34px - env(safe-area-inset-right, 0px))); transition: transform .25s ease; padding-right: env(safe-area-inset-right, 0px); }
.armory.is-open { transform: translateX(0); }
.armory-tab { width: 34px; height: 64px; border-radius: 10px 0 0 10px; border: 1px solid var(--rim); border-right: 0; background: var(--dusk-2); cursor: pointer; font-size: 1.2rem; color: var(--moon); }
.armory-tray { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--rim); border-right: 0; background: var(--dusk); border-radius: 12px 0 0 12px; min-width: 150px; box-shadow: -10px 10px 30px rgba(0,0,0,.4); }
.armory-title { font-size: .74rem; color: var(--mute); letter-spacing: .1em; text-transform: uppercase; }
.armory-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--rim); background: var(--night); cursor: pointer; text-align: left; }
.armory-item.is-on { border-color: var(--ember); background: color-mix(in srgb, var(--ember) 18%, var(--night)); }
.armory-icon { font-size: 1.4rem; }
.item-tomato .armory-icon { filter: saturate(.6) hue-rotate(-12deg) brightness(.85); }
.proj { position: fixed; left: 0; top: 0; z-index: 90; font-size: 34px; pointer-events: none; filter: drop-shadow(0 6px 6px rgba(0,0,0,.5)); }
.fp-proj { position: fixed; left: 50%; top: 50%; z-index: 95; font-size: 60px; pointer-events: none; }
.fp-splat { position: fixed; inset: 0; z-index: 94; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 12px; padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); animation: shake .4s ease; }
.fp-splat svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.fp-splat .btn, .fp-splat .fp-from { position: relative; z-index: 1; }
.fp-from { padding: 4px 12px; border-radius: 999px; background: var(--shade); }
.fp-blob { animation: blob .35s cubic-bezier(.2,1.6,.4,1) both; transform-origin: 200px 150px; }
.fp-egg .fp-blob { fill: #fff6dc; opacity: .94; } .fp-yolk { fill: #ffc93a; }
.fp-tomato .fp-blob { fill: #c6362d; opacity: .9; } .fp-mold circle { fill: #6d9b3f; opacity: .85; }
.fp-poo .fp-blob { fill: #6b4220; opacity: .92; }
.fp-drips rect { fill: inherit; animation: drip 4s ease-in forwards; transform-box: fill-box; transform-origin: top; }
.fp-egg .fp-drips rect { fill: #fff2c6; } .fp-tomato .fp-drips rect { fill: #b52f27; } .fp-poo .fp-drips rect { fill: #5c391b; }
@keyframes blob { from { transform: scale(.2); } to { transform: scale(1); } }
@keyframes drip { from { transform: scaleY(.2); } to { transform: scaleY(2.4); } }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translate(-8px, 4px); } 50% { transform: translate(7px, -5px); } 75% { transform: translate(-4px, 3px); } }
.flies { position: absolute; inset: 0; pointer-events: none; }
.flies span { position: absolute; left: 50%; top: 45%; font-size: 40px; color: #111; animation: fly 1.4s linear infinite; }
.flies span:nth-child(2) { animation-duration: 1.1s; animation-direction: reverse; } .flies span:nth-child(3) { animation-duration: 1.7s; }
@keyframes fly { from { transform: rotate(0deg) translateX(90px) rotate(0deg); } to { transform: rotate(360deg) translateX(90px) rotate(-360deg); } }

/* chat */
.chat-pill { position: fixed; right: calc(env(safe-area-inset-right, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 36; display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--rim); background: var(--dusk-2); cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--ember); font-size: .72rem; font-weight: 700; }
.chat-drawer { position: fixed; right: calc(env(safe-area-inset-right, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 36; width: min(360px, calc(100vw - 32px)); max-height: min(60vh, 520px); display: flex; flex-direction: column; border-radius: 14px; border: 1px solid var(--rim); background: var(--dusk); box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.chat-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--rim); }
.chat-list { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
.chat-line { font-size: .86rem; overflow-wrap: anywhere; }
.chat-line b { color: var(--moon); font-weight: 600; }
.chat-line.is-sys { color: var(--mute); font-style: italic; }
.chat-line.is-me b { color: var(--moss); }
.chat-form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--rim); }
.chat-form input { flex: 1; min-width: 0; min-height: 36px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--rim); background: var(--night); }

/* toasts */
.toasts { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 70px); left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; width: min(560px, calc(100vw - 32px)); pointer-events: none; }
.claim-toast { display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 10px; border-radius: 14px; background: var(--moon); color: var(--moon-ink); font-weight: 700; box-shadow: 0 12px 30px rgba(0,0,0,.45); animation: toast 1s ease forwards; }
.toast-art { width: 40px; height: 40px; border-radius: 50%; background: var(--dusk); object-fit: cover; object-position: top; flex-shrink: 0; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-12px) scale(.96); } 12% { opacity: 1; transform: none; } 65% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-10px); } }

/* vote */
.ballot { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.ballot-card { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; border-radius: var(--r); border: 1px solid var(--rim); background: var(--dusk); cursor: pointer; text-align: left; min-height: 120px; transition: border-color .15s, transform .15s; }
.ballot-card:hover:not(:disabled) { border-color: var(--mute); transform: translateY(-2px); }
.ballot-card.is-on { border-color: var(--ember); background: color-mix(in srgb, var(--ember) 14%, var(--dusk)); box-shadow: 0 0 0 1px var(--ember); }
.ballot-card:disabled { cursor: default; }
.ballot-name { font-weight: 700; font-size: 1.05rem; }
.ballot-finger { position: absolute; right: 12px; top: 10px; font-size: 1.4rem; opacity: 0; transition: opacity .15s, transform .2s; }
.ballot-card.is-on .ballot-finger { opacity: 1; transform: rotate(-12deg); }
.ballot-peace { border-style: dashed; }
.ballot-peace.is-on { border-color: var(--moss); background: color-mix(in srgb, var(--moss) 14%, var(--dusk)); box-shadow: 0 0 0 1px var(--moss); }
.peace-icon { font-size: 1.6rem; }
.vote-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }

/* hunt */
.hunt-overlay { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle, rgba(60,10,10,.6), rgba(3,5,12,.92)); animation: fadeIn .3s ease; }
.hunt-card { width: min(560px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 24px; border-radius: 18px; border: 1px solid var(--ember); background: var(--dusk); box-shadow: 0 0 60px color-mix(in srgb, var(--ember) 30%, transparent); max-height: calc(100vh - 32px); overflow-y: auto; }
.hunt-art { width: 140px; height: 170px; animation: bob 2s ease-in-out infinite; }
.hunt-targets { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* end */
.end { display: flex; flex-direction: column; gap: 18px; position: relative; }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 85; }
.end-banner { display: flex; flex-direction: column; gap: 8px; padding: 22px; border-radius: 18px; border: 1px solid var(--rim); background: linear-gradient(120deg, color-mix(in srgb, var(--tone) 24%, var(--dusk)), var(--dusk)); }
.tone-village { --tone: var(--moss); } .tone-wolf { --tone: var(--ember); } .tone-tanner { --tone: var(--hide); } .tone-none { --tone: var(--rim); }
.end-title { font-family: var(--display); font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 400; line-height: 1.1; }
.end-title small { font-size: .5em; color: var(--hide); }
.end-how { color: var(--mute); }
.end-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(210px, 44vw), 1fr)); gap: 10px; }
@media (max-width: 520px) { .end-cards .role-art { height: 64px; } .end-seat { padding: 10px 8px; } .end-seat footer .small { width: 100%; } }
.end-seat { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: var(--r); border: 1px solid var(--rim); background: var(--dusk); }
.end-seat.is-won { border-color: var(--moon); }
.end-seat.is-dead { background: linear-gradient(180deg, color-mix(in srgb, var(--ember) 14%, var(--dusk)), var(--dusk)); }
.end-seat.is-me { box-shadow: 0 0 0 1px var(--moon); }
.end-seat header, .end-seat footer { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.end-cards { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 4px; }
.end-cards figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.end-cards .role-art { height: 84px; width: auto; max-width: 100%; }
.end-cards figcaption { display: flex; flex-direction: column; align-items: center; font-size: .8rem; text-align: center; line-height: 1.2; }
.end-cards figcaption small { font-size: .66rem; color: var(--faint); }
.end-arrow { color: var(--moon); }
.end-lower { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 14px; align-items: start; }
.end-center { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.end-center .end-cards { grid-template-columns: 1fr; }
.end-center .end-arrow { transform: rotate(90deg); justify-self: center; }
.timeline { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; counter-reset: tl; }
.timeline li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; background: var(--dusk-2); font-size: .86rem; }
.timeline-art { width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; background: var(--night); object-fit: cover; object-position: top; }
@media (max-width: 760px) { .end-lower { grid-template-columns: 1fr; } }

/* modal */
.modal-back { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: var(--shade); animation: fadeIn .2s ease; }
.modal { width: min(480px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; border-radius: 16px; border: 1px solid var(--rim); background: var(--dusk); box-shadow: 0 24px 60px rgba(0,0,0,.55); }
.modal-wide { width: min(760px, 100%); }
.modal-head { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--rim); background: var(--dusk); }
.modal-head h2 { font-family: var(--display); font-size: 1.3rem; font-weight: 400; }
.modal-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.rules { display: flex; flex-direction: column; gap: 12px; }
.rules p { max-width: 68ch; }
.rules-roles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.rules-roles li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; padding: 8px; border-radius: 10px; background: var(--night); border: 1px solid var(--rim); }
.rules-roles h3 { font-family: var(--display); font-weight: 400; font-size: 1.05rem; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rules-roles h3 small { font-family: var(--body); color: var(--mute); font-size: .74rem; }
.rules-roles p { font-size: .82rem; color: var(--mute); margin-top: 4px; }
.rules-art { width: 56px; height: 64px; }
.net-warn { position: fixed; top: 60px; right: 16px; z-index: 60; padding: 2px 10px; border-radius: 999px; background: var(--ember); font-size: .8rem; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .theater-slash { display: none; }
}

@media (max-width: 640px) {
  .nav-tools .btn-sm { padding: 4px 10px; }
  .btn-label { display: none; }
  .theater { padding: 12px; }
  .theater-title { font-size: 1.9rem; }
  .theater-act { font-size: .88rem; }
  .tcard-label { font-size: .64rem; max-width: 84px; }
}

/* ---- phone pass ---- */
.lang-flip, .btn-ico, .armory-tab-phone, .dock-result { display: none; }
.action-dock { display: flex; flex-direction: column; gap: 12px; }
.dock-picked { font-size: .86rem; color: var(--moon); }
@media (max-width: 640px) {
  .lang-seg { display: none; }
  .lang-flip, .btn-ico { display: inline; }
  .lang-flip { display: inline-flex; font-family: var(--mono); }
  .nav-inner { gap: 8px; }
  .nav-tools { gap: 4px; }
  .nav-tools .btn-sm { min-width: 36px; min-height: 36px; padding: 4px 8px; }
  .btn-test-on { box-shadow: 0 0 0 2px color-mix(in srgb, var(--violet) 35%, transparent); }
  /* home: cast first, moon behind them, copy below */
  .hero { gap: 4px; }
  .lineup { order: -1; height: 170px; }
  .hero-moon { width: 96px; right: 4px; top: 4px; opacity: .8; }
  .hero-copy { padding-bottom: 4px; }
  .hero-title { font-size: 2.6rem; }
  /* lobby */
  .startbar { background: var(--night); border-top: 1px solid var(--rim); margin-inline: calc(-1 * var(--gutter-l)) calc(-1 * var(--gutter-r)); padding-left: var(--gutter-l); padding-right: var(--gutter-r); justify-content: space-between; }
  .startbar .small { flex: 1 1 140px; }
  .room-code { font-size: 2.2rem; }
  /* day + vote leave room for the floating buttons */
  .day, .vote { padding-bottom: 104px !important; }
  .day-bar { gap: 10px; }
  .day-actions { width: 100%; }
  .chat-pill { padding: 10px 14px; }
  /* throw tray becomes a button at bottom-left */
  .armory { top: auto; right: auto; left: calc(env(safe-area-inset-left, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); transform: none; flex-direction: column-reverse; align-items: flex-start; gap: 8px; padding-right: 0; }
  .armory.is-open { transform: none; }
  .armory-tab { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--rim); background: var(--dusk-2); box-shadow: 0 8px 24px rgba(0,0,0,.45); font-size: 1.3rem; }
  .armory-tab-desk { display: none; }
  .armory-tab-phone { display: inline; }
  .armory:not(.is-open) .armory-tray { display: none; }
  .armory-tray { border-radius: 12px; border-right: 1px solid var(--rim); }
  .armory-item { min-height: 44px; }
}
@media (max-width: 900px) {
  .night.has-dock { padding-bottom: 200px !important; }
  .has-dock .action-dock.is-on { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; gap: 8px; padding: 12px var(--gutter-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); background: color-mix(in srgb, var(--dusk) 97%, transparent); border-top: 1px solid var(--moon); box-shadow: 0 -12px 30px rgba(0,0,0,.5); backdrop-filter: blur(6px); }
  .has-dock .action-dock .row-gap .btn { flex: 1 1 0; min-height: 46px; }
  .has-dock .center-pick .btn { flex: 1 1 0; min-height: 40px; }
  .has-dock .dock-result { display: block; padding: 8px 10px; border-radius: 8px; background: var(--dusk-2); border-left: 3px solid var(--moon); font-size: .9rem; }
  .has-dock .action-dock:empty { display: none; }
}
@media (pointer: coarse) {
  .pin { min-width: 34px; height: 32px; }
  .pins { gap: 4px; }
  .seg-sm button { min-height: 32px; }
  .rchip-x { padding: 4px 6px; margin: -4px -6px -4px -2px; }
  .stepper button { width: 34px; height: 34px; }
  .mini-select { min-height: 36px; }
  .icon-btn { width: 36px; height: 36px; }
}
@media (max-width: 640px) {
  .pin { min-width: 34px; height: 32px; }
  .pins { gap: 4px; }
  .rchip-x { padding: 4px 6px; margin: -4px -6px -4px -2px; }
  .mini-select { min-height: 36px; }
  .ballot { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .ballot-card { min-height: 96px; padding: 12px; }
  .ballot-peace { grid-column: 1 / -1; }
  .vote-foot .btn { flex: 1 1 100%; }
}
@media (max-width: 640px) {
  .center-mark-grid { grid-template-columns: minmax(0, 1fr); }
  .center-box .pin { min-width: 34px; padding: 0 5px; }
  .center-box .lock-note { display: none; }
}
/* throw targeting: the other players' icons flash, tap one to throw */
.is-aiming .pcard.is-target { cursor: crosshair; animation: targetEdge 1.1s ease-in-out infinite; }
.is-aiming .pcard.is-target:hover, .is-aiming .pcard.is-target:active { background: color-mix(in srgb, var(--ember) 12%, var(--dusk)); }
.pcard-aim { background: var(--ember); color: var(--fg); font-size: 1rem; animation: badgeFlash .9s ease-in-out infinite; }
@keyframes badgeFlash {
  0% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ember) 75%, transparent); }
  50% { transform: scale(1.18); box-shadow: 0 0 0 9px color-mix(in srgb, var(--ember) 0%, transparent); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ember) 0%, transparent); }
}
@keyframes targetEdge { 0%, 100% { border-color: var(--rim); box-shadow: none; } 50% { border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember), 0 0 18px color-mix(in srgb, var(--ember) 35%, transparent); } }
.armory-armed { display: inline-flex; align-items: center; gap: 2px; font-size: 1.1rem; }
.armory-armed b { font-size: .8rem; color: var(--mute); }
.armory-tab.is-armed { border-color: var(--ember); background: color-mix(in srgb, var(--ember) 22%, var(--dusk-2)); }
@media (min-width: 641px) { .armory-tab.is-armed { width: 44px; } }
@media (prefers-reduced-motion: reduce) { .pcard-aim { box-shadow: 0 0 0 3px var(--ember); } .is-aiming .pcard.is-target { border-color: var(--ember); } }
